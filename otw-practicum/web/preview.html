<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renderer Preview (Temporary)</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      background: #1e2427;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 12px;
      font-size: 1.2rem;
      color: #38bdf8;
    }
    .preview-box {
      width: 1000px;
      aspect-ratio: 1000 / 700;
      border: 1px solid #475569;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .btn-group {
      display: flex;
      gap: 12px;
    }
    button {
      padding: 8px 16px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <h1>CampusMapRenderer Preview</h1>
  <div class="preview-box">
    <canvas id="preview-canvas"></canvas>
  </div>
  <div class="btn-group">
    <button id="btn-curve">Animate Curve: Informatics &rarr; Electrical Eng</button>
    <button id="btn-straight">Animate Straight: Main Gate &rarr; Graha</button>
    <button id="btn-reset">Reset View</button>
  </div>

  <script src="game.js"></script>
  <script>
    (function () {
      const canvas = document.getElementById("preview-canvas");
      let currentMap = null;

      async function load() {
        const res = await fetch("/map");
        currentMap = await res.json();
        CampusMapRenderer.render(canvas, currentMap, {
          proctorPhoto: "/assets/proctor.jpeg"
        });
      }

      document.getElementById("btn-curve").addEventListener("click", async () => {
        if (!currentMap) return;
        await CampusMapRenderer.animateMove(canvas, currentMap, "informatics", "electrical_eng", "student", {
          proctorPhoto: "/assets/proctor.jpeg",
          duration: 1000
        });
      });

      document.getElementById("btn-straight").addEventListener("click", async () => {
        if (!currentMap) return;
        await CampusMapRenderer.animateMove(canvas, currentMap, "main_gate", "graha", "proctor", {
          proctorPhoto: "/assets/proctor.jpeg",
          duration: 1000
        });
      });

      document.getElementById("btn-reset").addEventListener("click", () => {
        if (!currentMap) return;
        CampusMapRenderer.render(canvas, currentMap, {
          proctorPhoto: "/assets/proctor.jpeg"
        });
      });

      load();
    })();
  </script>
</body>
</html>
